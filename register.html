<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ثبت‌نام | بازارینو</title>
    <link rel="stylesheet" href="./register.css">
</head>

<body>

    <header class="header">
        <a href="products.html" class="logo">بازارینو</a>
        <a href="#" class="cart-link">سبد خرید <span class="cart-badge">۲</span></a>
    </header>

    <main class="main">
        <section class="auth-card">
            <h1 class="auth-title">ساخت حساب کاربری</h1>
            <p class="subtitle">برای خرید سریع‌تر، حساب بازارینو را بسازید.</p>

            <form action="#" method="post">
                <label class="form-field">
                    <span class="form-label">ایمیل</span>
                    <input
                        class="form-input"
                        type="email"
                        name="email"
                        required
                        autocomplete="email"
                        placeholder="name@example.com">
                </label>

                <label class="form-field">
                    <span class="form-label">شماره همراه</span>
                    <input
                        class="form-input"
                        type="tel"
                        name="phone"
                        required
                        pattern="09[0-9]{9}"
                        maxlength="11"
                        autocomplete="tel"
                        placeholder="09123456789">
                </label>

                <label class="form-field">
                    <span class="form-label">رمز عبور</span>
                    <input
                        class="form-input"
                        type="password"
                        name="password"
                        required
                        minlength="8"
                        maxlength="64"
                        autocomplete="new-password"
                        placeholder="حداقل ۸ کاراکتر">
                </label>

                <label class="form-field">
                    <span class="form-label">تکرار رمز عبور</span>
                    <input
                        class="form-input"
                        type="password"
                        name="password-confirm"
                        required
                        minlength="8"
                        maxlength="64"
                        autocomplete="new-password"
                        placeholder="رمز عبور را دوباره وارد کنید">
                </label>

                <div class="form-actions">
                    <button class="reset-button" type="reset">پاک کردن</button>
                    <button class="submit-button" type="submit">ثبت‌نام</button>
                </div>
            </form>
        </section>
    </main>

</body>

</html>
