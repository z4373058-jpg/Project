<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ثبت نام | بازارینو</title>
    <link rel="stylesheet" href="">
</head>

<body>
    <header class="header">
        <div class="head-start">
            <a href="index.html" class="header-logo">بازارینو<a>
            <nav class="main-nav">
                <a href="index.html">خانه</a>
                <a href="index.html">فروشگاه</a>
                <a href="#">دسته بندی</a>
                <a href="#">درباره ما</a>
            </nav>
        </div>

        <div class="head-end">
            <a href="#" class="cart-link">سبد خرید</a>
            <a href="#" class="login-link">ورود</a>
        </div>
    </header>

    <main class="main">
    <form action="">
        <h1 class="auth-title">ساخت حساب کاربری</h1>
        <p class="subtitle">برای خرید سریع تر،حساب بازارینو را بسازید.</p>

        <label class="form-field">
            <span class="form-label">ایمیل</span>
            <input class="form-input" type="email" name="email" required autocomplete="email" placeholder="name@example.com">
        </label>

        <label class="form-field">
            <span class="form-label">شماره همراه</span>
            <input  class="form-input" type="tel" name="phone" required pattern="09[0-9]{9}" autocomplete="tel" placeholder="09xxxxxxxx">
        </label>

        <label class="form-field">
            <span class="form-label">رمز عبور</span>
            <input class="form-input" type="password" name="password" required minlength="8" maxlength="64" autocomplete="new-password">
        </label>

        <label class="form-field">
            <span class="form-label">تکرار رمز عبور</span>
            <input class="form-input" type="password" name="password-confirm" required minlength="8" maxlength="64" autocomplete="new-password">
        </label>

        <button type="reset">پاک کردن</button>
        <button type="submit">ثبت نام </button>
    </form>
    <footer class="footer">
        <div class="footer-inner">
            <p class="footer-brand">
                بازارینو؛ خرید ساده و مطمئن
            </p>
            <nav class="footer-links">
            <a href="#">پشتیبانی</a>
            <a href="#">قوانین و شرایط</a>
            <a href="#">اینستاگرام</a>
            </nav>
            <p class="footer-copy">&copy; 1405</p>
            </div>
    </footer>
</body>
</html>
